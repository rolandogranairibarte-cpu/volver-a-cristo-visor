<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volver a Cristo — Lector online</title>
<style>
:root{
  --sidebar:#0d1218;
  --sidebar-2:#151b22;
  --gold:#e7b94f;
  --gold-soft:#d7b56b;
  --cream:#eee8d9;
  --cream-2:#e5ddcc;
  --red:#9b2035;
  --red-dark:#741728;
  --ink:#241f1a;
  --line:#cfc4ae;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:var(--cream);color:var(--ink)}
.app{height:100vh;display:flex;background:var(--cream)}
.sidebar{
  width:275px;flex:0 0 275px;background:var(--sidebar);color:#f1e8d6;
  overflow-y:auto;padding:20px 14px 35px;border-right:1px solid #30363d;
  scrollbar-width:thin;
}
.brand-small{font-size:12px;letter-spacing:1.5px;color:var(--gold);font-weight:bold;text-transform:uppercase}
.brand{font-size:22px;font-weight:bold;margin:7px 0 17px;color:#fff}
.rule{height:1px;background:#39404a;margin:0 0 18px}
.toc-title{font-size:13px;letter-spacing:1px;color:var(--gold);font-weight:bold;margin-bottom:10px}
.toc a{
  display:block;color:#f0eadf;text-decoration:none;font-size:15px;line-height:1.25;
  padding:6px 8px;border-radius:4px;margin:1px 0;
}
.toc a:hover{background:#292f37}
.toc a.active{background:#3d372a;color:#fff}
.toc a.chapter{color:var(--gold);font-weight:bold;text-transform:uppercase;margin-top:8px}
.toc a.sub{padding-left:8px}
.viewer{min-width:0;flex:1;display:flex;flex-direction:column}
.toolbar{
  height:70px;flex:0 0 70px;background:#f6efdf;border-bottom:1px solid #cdbf9f;
  display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 14px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:5;
}
button,input{font:inherit}
.btn{
  border:1px solid #cbbd9e;background:#fbf7ec;color:#3d362e;border-radius:4px;
  padding:8px 12px;cursor:pointer;white-space:nowrap
}
.btn:hover{background:#f0e7d5}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:bold}
.btn.primary:hover{background:var(--red-dark)}
.page-label{font-size:15px}
.page-input{width:68px;text-align:center;padding:8px 5px;border:1px solid #cbbd9e;border-radius:4px;background:#fffaf0}
.zoom-wrap{display:flex;align-items:center;gap:7px;margin-left:4px}
.zoom{width:115px;accent-color:var(--red)}
.reader{
  flex:1;overflow:auto;background:
  radial-gradient(circle at 50% 15%,rgba(255,255,255,.38),transparent 42%),
  var(--cream);
  padding:18px 20px 45px;
}
.notice{text-align:center;font-size:14px;margin:8px 0 16px;color:#594f43}
.page-shell{
  max-width:1030px;margin:0 auto;background:#d9d2c3;border:1px solid #c3baa7;
  padding:32px 22px 20px;box-shadow:0 2px 10px rgba(0,0,0,.10);
  position:relative;
}
.page-nav{
  display:flex;align-items:center;justify-content:space-between;margin:-1px 0 8px;
}
.arrow{
  width:70px;height:64px;border:0;border-radius:4px;background:var(--red);color:#fff;
  font-size:35px;cursor:pointer;opacity:.95
}
.arrow:disabled{background:#c8a4a8;cursor:not-allowed}
.page-counter{
  background:#fffaf0;border:1px solid #cbbd9e;border-radius:4px;padding:10px 14px;
  font-weight:bold;color:#51483d
}
#pageCanvas{
  display:block;margin:0 auto;background:white;box-shadow:0 1px 5px rgba(0,0,0,.18);
  max-width:100%;height:auto;
}
.loading{text-align:center;padding:40px;color:#62584b}
.footer-note{text-align:center;font-size:12px;color:#7a6e5d;margin-top:12px}
@media(max-width:800px){
  .sidebar{position:fixed;left:-285px;top:0;bottom:0;z-index:20;transition:left .2s}
  .sidebar.open{left:0}
  .toolbar{height:auto;min-height:70px;flex-wrap:wrap;gap:6px}
  .zoom-wrap{width:100%;justify-content:center;margin:0}
  .reader{padding:10px 5px 30px}
  .page-shell{padding:12px 8px}
  .arrow{width:52px;height:48px;font-size:28px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand-small">LIBROS DE CONSULTA</div>
    <div class="brand">Volver a Cristo</div>
    <div class="rule"></div>
    <div class="toc-title">ÍNDICE</div>
    <nav class="toc" id="toc"></nav>
  </aside>

  <main class="viewer">
    <header class="toolbar">
      <button class="btn" id="prevTop">Anterior</button>
      <span class="page-label">Página</span>
      <input class="page-input" id="pageInput" type="number" min="1" value="1" aria-label="Número de página">
      <span class="page-label">/ 298</span>
      <button class="btn" id="nextTop">Siguiente</button>
      <button class="btn primary" id="toggleToc">Abrir índice</button>
      <div class="zoom-wrap">
        <span>Zoom</span>
        <input class="zoom" id="zoom" type="range" min="0.7" max="2.2" step="0.05" value="1">
      </div>
    </header>

    <section class="reader" id="reader">
      <div class="notice">Consulta en línea. El visor no muestra botón de descarga.</div>
      <div class="page-shell">
        <div class="page-nav">
          <button class="arrow" id="prevArrow" aria-label="Página anterior">‹</button>
          <div class="page-counter">Página <span id="pageNow">1</span> de <span id="pageTotal">298</span></div>
          <button class="arrow" id="nextArrow" aria-label="Página siguiente">›</button>
        </div>
        <div id="loading" class="loading">Cargando el libro…</div>
        <canvas id="pageCanvas"></canvas>
        <div class="footer-note">Volver a Cristo · Maxi Alvarez</div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

const tocEl = document.getElementById("toc");
toc.forEach(([label,page,kind])=>{
  const a=document.createElement("a");
  a.href="#";
  a.textContent=label;
  a.className=kind;
  a.dataset.page=page;
  a.addEventListener("click",e=>{e.preventDefault();goTo(page);});
  tocEl.appendChild(a);
});

let pdfDoc=null, current=1, scale=1.0, rendering=false, pending=null;

function fitScale(page){
  const baseViewport=page.getViewport({scale:1});
  const available=document.getElementById("reader").clientWidth-70;
  return Math.min(available/baseViewport.width, 1.35) * scale;
}

async function renderPage(num){
  if(!pdfDoc) return;
  if(rendering){ pending=num; return; }
  rendering=true;
  document.getElementById("loading").style.display="block";
  try{
    const page=await pdfDoc.getPage(num);
    const s=fitScale(page);
    const viewport=page.getViewport({scale:s});
    const canvas=document.getElementById("pageCanvas");
    const ctx=canvas.getContext("2d");
    canvas.width=Math.floor(viewport.width);
    canvas.height=Math.floor(viewport.height);
    canvas.style.width=viewport.width+"px";
    canvas.style.height=viewport.height+"px";
    document.getElementById("loading").style.display="none";
    await page.render({canvasContext:ctx,viewport}).promise;
    current=num;
    document.getElementById("pageInput").value=current;
    document.getElementById("pageNow").textContent=current;
    document.getElementById("prevTop").disabled=current<=1;
    document.getElementById("prevArrow").disabled=current<=1;
    document.getElementById("nextTop").disabled=current>=TOTAL;
    document.getElementById("nextArrow").disabled=current>=TOTAL;
    document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("active",Number(a.dataset.page)===current));
  }catch(err){
    console.error(err);
    document.getElementById("loading").textContent="No se pudo mostrar esta página.";
  }finally{
    rendering=false;
    if(pending){const p=pending;pending=null;renderPage(p);}
  }
}

function goTo(n){
  n=Math.max(1,Math.min(TOTAL,parseInt(n)||1));
  document.getElementById("reader").scrollTop=0;
  renderPage(n);
}

document.getElementById("prevTop").onclick=()=>goTo(current-1);
document.getElementById("nextTop").onclick=()=>goTo(current+1);
document.getElementById("prevArrow").onclick=()=>goTo(current-1);
document.getElementById("nextArrow").onclick=()=>goTo(current+1);
document.getElementById("pageInput").addEventListener("change",e=>goTo(e.target.value));
document.getElementById("zoom").addEventListener("input",e=>{scale=parseFloat(e.target.value);renderPage(current);});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") goTo(current-1);
  if(e.key==="ArrowRight") goTo(current+1);
});

document.getElementById("toggleToc").onclick=()=>{
  const s=document.getElementById("sidebar");
  const isOpen=s.classList.toggle("open");
  if(window.innerWidth<=800) document.getElementById("toggleToc").textContent=isOpen?"Cerrar índice":"Abrir índice";
};

window.addEventListener("resize",()=>{ if(pdfDoc) renderPage(current); });

pdfjsLib.getDocument(PDF_URL).promise.then(doc=>{
  pdfDoc=doc;
  document.getElementById("pageTotal").textContent=doc.numPages;
  goTo(1);
}).catch(err=>{
  console.error(err);
  document.getElementById("loading").innerHTML =
    "No se pudo cargar el PDF. Comprueba que <b>volver-a-cristo.pdf</b> esté en la misma carpeta que este visor.";
});
</script>
</body>
</html>
